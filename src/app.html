<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a3f">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan DCG">
<title>Plan DCG</title>
<link rel="icon" type="image/svg+xml" href="__FAVICON__">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* « Cordée » : le ciel et la crête en haut, le carnet net en dessous. Nuit, corail, or.
   Couleur = matière ; or = toi et le sommet ; corail = ce qui est en cours ou en retard. */
:root{
  --f-display:"Sora",system-ui,sans-serif;
  --f-text:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#f6f8fc; --paper:#ffffff; --ink:#141a3f; --ink2:#3d4472; --ink3:#585e8c; --rule:#e2e6f1; --rule2:#c9cfe5; --ctl:#585e8c; --pen:#141a3f;
  --gold:#ffc247; --gold2:#ffb23e; --gold-soft:#fff1cf; --hl:#ffc247; --hl-ink:#141a3f;
  --coral:#ff7a59; --coral-ink:#ad3a16; --coral-soft:#ffebe3; --ok:#0d7357; --ok-soft:#dcf3ea;
  --pri:#141a3f; --on-pri:#ffffff; --pri-sh:0 8px 18px -8px rgba(20,26,63,.5); --hero-line:#141a3f; --tick:#141a3f; --box-on:#ffe29a;
  --today:#141a3f; --on-today:#ffffff; --today-dot:#ffc247; --tab:#ffffff; --focus:#3b5bdb; --acc-ic:#141a3f;
  --sh:0 1px 2px rgba(20,26,63,.05); --scrim:rgba(11,14,34,.5);
  --stamp:#141a3f; --veil:rgba(246,248,252,.9); --sw-y:88%; --sw-h:34%;
  --ue1:#2f4fd1; --ue5:#0d7357; --ue7:#7a3fc4; --ue8:#0b6a80; --ue9:#b3263f; --ue12:#8f5200; --ue13:#a82a85; --on-ue:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e22; --paper:#151935; --ink:#eef0ff; --ink2:#b9bde2; --ink3:#9da3ce; --rule:#262b52; --rule2:#3b4273; --ctl:#8f95c4; --pen:#cfd3f4;
    --gold:#ffcd5c; --gold2:#ffb84a; --gold-soft:rgba(255,205,92,.16); --hl:#ffcd5c; --hl-ink:#141a3f;
    --coral:#ff8a6a; --coral-ink:#ff9e82; --coral-soft:rgba(255,122,89,.17); --ok:#62e0b0; --ok-soft:rgba(98,224,176,.14);
    --pri:#ffcd5c; --on-pri:#141a3f; --pri-sh:0 8px 20px -8px rgba(255,190,80,.45); --hero-line:#ffcd5c; --tick:#ffcd5c; --box-on:rgba(255,205,92,.16);
    --today:#ffcd5c; --on-today:#141a3f; --today-dot:#141a3f; --tab:#10132c; --focus:#a9bcff; --acc-ic:#ffcd5c;
    --sh:0 1px 0 rgba(255,255,255,.03) inset; --scrim:rgba(3,4,14,.66); --stamp:#ffcd5c; --veil:rgba(11,14,34,.88); --sw-y:100%; --sw-h:12%;
    --ue1:#93a8ff; --ue5:#55d6a7; --ue7:#c6a0ff; --ue8:#5fd0e8; --ue9:#ff8ea1; --ue12:#ffc45c; --ue13:#ff92d8; --on-ue:#141a3f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e22; --paper:#151935; --ink:#eef0ff; --ink2:#b9bde2; --ink3:#9da3ce; --rule:#262b52; --rule2:#3b4273; --ctl:#8f95c4; --pen:#cfd3f4;
  --gold:#ffcd5c; --gold2:#ffb84a; --gold-soft:rgba(255,205,92,.16); --hl:#ffcd5c; --hl-ink:#141a3f;
  --coral:#ff8a6a; --coral-ink:#ff9e82; --coral-soft:rgba(255,122,89,.17); --ok:#62e0b0; --ok-soft:rgba(98,224,176,.14);
  --pri:#ffcd5c; --on-pri:#141a3f; --pri-sh:0 8px 20px -8px rgba(255,190,80,.45); --hero-line:#ffcd5c; --tick:#ffcd5c; --box-on:rgba(255,205,92,.16);
  --today:#ffcd5c; --on-today:#141a3f; --today-dot:#141a3f; --tab:#10132c; --focus:#a9bcff; --acc-ic:#ffcd5c;
  --sh:0 1px 0 rgba(255,255,255,.03) inset; --scrim:rgba(3,4,14,.66); --stamp:#ffcd5c; --veil:rgba(11,14,34,.88); --sw-y:100%; --sw-h:12%;
  --ue1:#93a8ff; --ue5:#55d6a7; --ue7:#c6a0ff; --ue8:#5fd0e8; --ue9:#ff8ea1; --ue12:#ffc45c; --ue13:#ff92d8; --on-ue:#141a3f;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--f-text);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
h1,h2,h3,h4,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
[hidden]{display:none !important}
.num{font-variant-numeric:tabular-nums lining-nums}
.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;width:20px;height:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eb{font:600 11.5px/1.25 var(--f-text);letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.hd :focus-visible,.summit :focus-visible{outline-color:#a9bcff}
::placeholder{color:var(--ink3);opacity:1}
html.locked,html.locked body{overflow:hidden}

/* ---------- coquille ---------- */
.app{max-width:620px;margin:0 auto;min-height:100vh;padding-bottom:calc(156px + env(safe-area-inset-bottom))}
.side,.dhead,.only-desk,.skip.only-wide{display:none}

/* ciel (la nuit qui se lève, en clair comme en sombre) */
.hd{position:relative;overflow:hidden;color:#fff;padding-top:calc(env(safe-area-inset-top) + 8px);background:linear-gradient(180deg,#141a3f 0%,#1a2056 40%,#2c2766 58%,#83406e 73%,#ff7a59 87%,#ffc247 100%)}
.hd.compact{background:linear-gradient(180deg,#141a3f 0%,#1a2056 52%,#2c2766 82%,#4b3478 100%)}
.stars{position:absolute;left:0;top:0;width:100%;height:230px;pointer-events:none}
.stars circle{fill:#fff}
.tw{animation:tw 3.2s ease-in-out infinite}
.tw:nth-child(3n){animation-delay:1.1s} .tw:nth-child(3n+1){animation-delay:2s}
.hd-top{position:relative;display:flex;align-items:center;gap:10px;padding:4px 20px 0;min-height:44px}
.logo{width:36px;height:36px;display:block;flex:none;filter:drop-shadow(0 4px 10px rgba(255,140,80,.35))}
.brand{font:800 18px/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.jp{margin-left:auto;display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:12.5px;color:#e6e8ff;white-space:nowrap}
.jp b{font:800 16px/1 var(--f-display);color:#ffd27a;letter-spacing:-.01em}
.hd-date{position:relative;padding:12px 20px 0}
.sky-eb{font:700 12px/1.2 var(--f-text);letter-spacing:.14em;text-transform:uppercase;color:#ffd27a}
.hd h1{font:700 31px/1.08 var(--f-display);letter-spacing:-.02em;margin-top:5px;text-wrap:balance}
.hd.compact h1{font-size:29px}
.hchips{position:relative;display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px 0}
.hchip{position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.12);font:600 13.5px/1.2 var(--f-text);color:#fff;text-decoration:none;white-space:nowrap}
a.hchip{border:1px solid rgba(255,255,255,.5)}
a.hchip::after{content:"";position:absolute;inset:-7px -2px}
.hchip .ic{width:15px;height:15px;color:#7ff0c2;stroke-width:2.6}
.hchip.warn .ic{color:#ffb39c}
.scene{display:block;width:100%;height:auto}
.hd .scene{margin-bottom:-2px}
.svt{font:700 12.5px var(--f-text);letter-spacing:.01em}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 2.4s ease-out infinite}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:wave 2.8s ease-in-out infinite}
.ridge-thin{display:block;width:100%;height:34px;margin-top:16px}

/* ---------- carnet ---------- */
.main{position:relative;padding:0 16px}
.main.v-aujourdhui{padding-top:0}
.main:not(.v-aujourdhui){padding-top:10px}
.card-p{position:relative;padding:15px 16px 14px;border:1px solid var(--rule2);border-radius:14px;background:var(--paper);box-shadow:var(--sh)}
.v-aujourdhui .drow>.card-p:first-child{margin-top:-16px}
.day-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.day-sub{font:500 13.5px/1.4 var(--f-text);color:var(--ink2);margin-top:6px}
.day-sub b{color:var(--ink);font-weight:600}
.day-n{font:800 42px/.9 var(--f-display);letter-spacing:-.035em;white-space:nowrap}
.day-n small{font:700 18px var(--f-display);color:var(--ink3);margin-left:2px;letter-spacing:0}
.segs{display:grid;gap:6px;margin:13px 0 0}
.segs.dense{gap:3px}
.segs i{position:relative;overflow:hidden;height:9px;border:1px solid var(--pen);border-radius:2px}
.segs i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--coral),var(--gold));transform:scaleX(0);transform-origin:0 50%;transition:transform .45s cubic-bezier(.3,1.2,.5,1)}
.segs i.f::after{transform:none}
.segs i.h::after{transform:scaleX(.5)}
/* la phrase d'encouragement du jour (voir CHEER), puis l'info utile en petit */
.cheer{margin-top:12px;font:600 16px/1.38 var(--f-text);color:var(--ink);text-wrap:pretty;overflow-wrap:break-word}
.cheer.pg{margin-top:14px;padding-left:12px;border-left:3px solid var(--gold2)}
.phr{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font:500 14.5px/1.38 var(--f-text);color:var(--ink2)}
.cheer+.phr{margin-top:6px;font-size:13.5px}
.phr>span{min-width:0;overflow-wrap:break-word}
.phr .ic{width:18px;height:18px;color:var(--coral-ink);margin-top:1px}
.cheer+.phr .ic{width:16px;height:16px}
.phr b{color:var(--ink);font-weight:600}
.rest h2{font:700 22px/1.15 var(--f-display);letter-spacing:-.02em;margin-top:8px}
.rest p.t{font:500 15px/1.45 var(--f-text);color:var(--ink2);margin-top:6px}
.rest p.t.cheer{font-weight:600;color:var(--ink);margin-top:8px}
.rest h2,.rest p.t{overflow-wrap:break-word}
.rest .day-top>div{min-width:0}
.rest .ri{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);color:var(--acc-ic);flex:none}
.rest .ri .ic{width:24px;height:24px}
.rest .acts{margin-top:14px}
.note{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:10px 0 12px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.note-q{font:700 40px/.7 var(--f-display);color:var(--coral-ink);flex:none;margin-top:8px}
.note .nt{font:500 15px/1.42 var(--f-text);margin-top:5px}
.note .nt.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{display:inline-flex;align-items:center;min-height:44px;margin:-4px 0 -12px;font:600 14px/1 var(--f-text);color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--gold2);text-decoration-thickness:2px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 2px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.sec h2{font:700 20px/1.1 var(--f-display);letter-spacing:-.02em}
.sec .eb{white-space:nowrap}

/* agenda : les heures dans la marge */
.agenda{position:relative}
.slot{display:grid;grid-template-columns:47px minmax(0,1fr);position:relative}
.gut{position:relative;border-right:1px solid var(--rule2);padding:15px 7px 14px 0;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;font:600 14px/1 var(--f-display);font-variant-numeric:tabular-nums lining-nums;min-height:72px}
.gut .e{color:var(--ink3);font-size:12.5px}
.nowm{position:absolute;right:3px;font:700 11.5px/1 var(--f-display);font-variant-numeric:tabular-nums lining-nums;background:var(--hl);color:var(--hl-ink);padding:4px;border-radius:3px 6px 3px 6px;box-shadow:0 0 0 3px var(--bg);z-index:1}
.nowm::after{content:"";position:absolute;right:-14px;top:50%;width:14px;height:2px;margin-top:-1px;background:var(--hl)}
.nowrow{display:grid;grid-template-columns:47px minmax(0,1fr);align-items:center;height:26px}
.nowrow .gut{min-height:26px;padding:0;height:100%;justify-content:center}
.nowrow .gut .nowm{position:relative;right:3px}
.nowrow .nl{height:2px;margin-left:9px;background:repeating-linear-gradient(90deg,var(--hl) 0 6px,transparent 6px 10px)}
.card{position:relative;background:var(--paper);border:1px solid var(--rule2);border-radius:12px;padding:14px 13px 4px 15px;margin:12px 0 12px 9px;box-shadow:inset 3px 0 0 var(--ue,var(--ink3)),var(--sh)}
.card.hero{border:1.5px solid var(--hero-line);padding-bottom:14px}
.card.flat{padding-bottom:14px}
.card.skipped{border-style:dashed;box-shadow:none;background:transparent}
.card.bil{box-shadow:inset 3px 0 0 var(--gold2),var(--sh)}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:16px}
.tag{display:inline-flex;align-items:center;gap:7px;font:700 11px/1 var(--f-text);letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink3);flex:none}
.tag.tg-now{color:var(--coral-ink)}
.tag.tg-now i{border:0;background:var(--coral);animation:pulse 1.8s ease-out infinite}
.tag.tg-next{color:var(--ink2)} .tag.tg-next i{border-color:var(--coral)}
.tag.tg-done{color:var(--ok)} .tag.tg-done i{border:0;background:var(--ok)}
.tag.tg-part{color:var(--ink2)} .tag.tg-part i{border-color:var(--gold2);background:linear-gradient(90deg,var(--gold2) 50%,transparent 50%)}
.tag.tg-miss{color:var(--coral-ink)} .tag.tg-miss i{border-color:var(--coral-ink)}
.tag.tg-flex,.tag.tg-extra{color:var(--ink2)} .tag.tg-flex i,.tag.tg-extra i{border:0;background:var(--gold2)}
.tag.tg-free{color:var(--ok)} .tag.tg-free i{border-color:var(--ok)}
.time{font:600 14px/1 var(--f-display);white-space:nowrap}
.c-open{display:block;width:100%;text-align:left;min-height:44px;padding:0;border-radius:6px;color:inherit}
.c-open .ue{display:inline-flex;align-items:center;gap:7px;margin-top:11px;font:600 13px/1 var(--f-text);color:var(--ue)}
.ue i,.sq{width:10px;height:10px;border-radius:2px;background:var(--ue,var(--ink3));flex:none;display:inline-block}
.c-open .ttl{display:block;font:600 19px/1.22 var(--f-display);letter-spacing:-.02em;margin:7px 0 4px;text-wrap:pretty}
.card:not(.hero) .ttl{font-size:17.5px}
.card.done .ttl{color:var(--ink2)}
.c-open .meta{display:block;font:500 13px/1.35 var(--f-text);color:var(--ink3);margin-bottom:8px}
.items{margin-top:4px;border-top:1px solid var(--rule)}
.card .items{margin-top:6px}
.item{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:12px;align-items:start;padding:11px 2px;min-height:56px;border-bottom:1px solid var(--rule);cursor:pointer;border-radius:4px;-webkit-user-select:none;user-select:none}
.item:last-child{border-bottom:0}
.card:not(.hero) .item{min-height:50px;padding:9px 2px}
.item.static{cursor:default}
.cb{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.item:has(.cb:focus-visible){box-shadow:0 0 0 3px var(--focus)}
.box{width:28px;height:28px;display:block;overflow:visible}
.bx{fill:var(--paper);stroke:var(--pen);stroke-width:1.6;transition:fill .25s}
.item.on .bx{fill:var(--box-on)}
.tk{fill:none;stroke:var(--tick);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26}
.item.on .tk{stroke-dashoffset:0}
.item.just .tk{animation:draw .3s cubic-bezier(.6,0,.3,1) both}
.bu line{stroke:var(--coral);stroke-width:1.8;stroke-linecap:round;opacity:0;transform-box:view-box;transform-origin:14px 14px}
.bu line:nth-child(even){stroke:var(--gold2)}
.item.just .bu line{animation:burst .55s ease-out}
.item.just .bx{transform-box:fill-box;transform-origin:center;animation:press .32s ease-out}
.kind{display:flex;justify-content:space-between;gap:8px;font:600 11px/1.1 var(--f-text);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:2px 0 5px}
.dur{font-variant-numeric:tabular-nums;color:var(--ink2);letter-spacing:.02em;text-transform:none;font-size:12.5px;white-space:nowrap}
.txt{display:inline;font:500 15px/1.35 var(--f-text);color:var(--ink);background:linear-gradient(var(--ink2),var(--ink2)) 0 62%/0 1.5px no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.item.on .txt{background-size:100% 1.5px;color:var(--ink3)}
.item.just .txt{animation:strike .38s ease .08s both}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{flex:1 1 auto;white-space:nowrap;min-height:48px;border-radius:11px;font:600 15px/1 var(--f-text);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);color:var(--ink);background:transparent;padding:0 14px;text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn .ic{width:18px;height:18px;stroke-width:2.2}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--on-pri);box-shadow:var(--pri-sh)}
.acts .btn.primary{flex:1.6 1 auto}
.card .acts .btn{padding:0 12px;font-size:14.5px;gap:6px}
.btn.sun{background:linear-gradient(135deg,#ffd36b,#ffb23e);border:0;color:#141a3f;box-shadow:0 10px 22px -10px rgba(255,140,40,.8)}
.btn:disabled{border-style:dashed;border-color:var(--ctl);background:transparent;color:var(--ink3);box-shadow:none;cursor:not-allowed;transform:none}
.skip{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:2px;font:500 14px/1.2 var(--f-text);color:var(--ink2);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--ctl)}
.skip .ic{width:17px;height:17px}
.behind{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--coral-soft);font:500 14.5px/1.42 var(--f-text);color:var(--ink)}
.behind .ic{color:var(--coral-ink);margin-top:1px}
.behind b{font-weight:700}

/* semaine en bandeau, demain */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:15px}
@media (max-width:374px){.wk{gap:2px}}
.d{display:block;border:1px solid var(--rule2);border-radius:10px;padding:7px 0 6px;text-align:center;min-height:60px;min-width:0;color:var(--ink);background:transparent;text-decoration:none}
button.d{border-color:var(--ctl);cursor:pointer}
.d .l{display:block;font:600 11px/1 var(--f-text);letter-spacing:.04em;color:var(--ink3);text-transform:uppercase}
.d .dn{display:block;font:700 19px/1 var(--f-display);margin-top:6px}
.d .dots{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;margin:7px 3px 0;min-height:5px}
.d .dots i{width:5px;height:5px;border-radius:1px;border:1px solid var(--ue,var(--ink));background:transparent}
.d .dots i.f{background:var(--ue,var(--ink))}
.d.off{border-style:dashed}
.d.off .dn{color:var(--ink3);font-weight:600}
.d.today:not(.cur){border:2px solid var(--ink)}
.d.cur{background:var(--today);border-color:var(--today);color:var(--on-today);box-shadow:0 8px 16px -10px rgba(20,26,63,.7)}
.d.cur .l,.d.cur .dn{color:var(--on-today)}
.d.cur .dots i{border-color:var(--today-dot)}
.d.cur .dots i.f{background:var(--today-dot)}
.d.skipd .dn{text-decoration:line-through;text-decoration-thickness:2px}
.tm li{border-bottom:1px solid var(--rule)}
.tm li:last-child{border-bottom:0}
.tm button{display:grid;grid-template-columns:44px 10px minmax(0,1fr);align-items:center;gap:10px;width:100%;min-height:44px;padding:4px 0;text-align:left;font:500 14.5px/1.25 var(--f-text);border-radius:6px}
.tm .t{font:600 14px/1 var(--f-display);text-align:right}
.tm .bil{font-weight:600}
.tm .bil .sq{background:var(--gold);border:1.5px solid var(--gold2)}
.tm .sk{color:var(--ink3);text-decoration:line-through}

/* sommet (carte) */
.summit{position:relative;overflow:hidden;border-radius:14px;color:#fff;background:linear-gradient(180deg,#141a3f 0%,#1a2056 34%,#30296a 54%,#83406e 70%,#ff7a59 86%,#ffc247 100%)}
.summit .stars{height:120px}
.sum-h{position:relative;padding:16px 18px 0}
.sum-h b{display:block;font:800 36px/1 var(--f-display);color:#ffd27a;letter-spacing:-.035em;margin-top:6px}
.sum-h span{display:block;font-size:13.5px;color:#e6e8ff;margin-top:5px}
.sum-ch{position:relative;display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px 0}
.sum-ch .hchip{font-size:12.5px;padding:5px 10px}
.summit .scene{margin-top:-6px}

/* progrès */
.subjects li{padding:13px 0 12px;border-bottom:1px solid var(--rule)}
.s-head{display:flex;align-items:center;gap:9px}
.s-head b{font:600 15.5px/1.25 var(--f-text);flex:1;min-width:0}
.s-head .pct{font:700 17px/1 var(--f-display);white-space:nowrap}
.bar{height:9px;border:1px solid var(--pen);border-radius:2px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--ue,linear-gradient(90deg,var(--coral),var(--gold)))}
.bar.sun i{background:linear-gradient(90deg,var(--coral),var(--gold))}
.s-meta{font:500 13.5px/1.4 var(--f-text);color:var(--ink2);margin-top:7px}
.s-meta .ok{color:var(--ok);font-weight:600}
.s-meta .late{color:var(--coral-ink);font-weight:600}
.s-meta .warn{display:block;color:var(--coral-ink);font-weight:600;margin-top:2px}
.scores{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.scores .eb{margin-right:2px}
.score{min-width:52px;height:44px;padding:0 8px;border-radius:9px;display:grid;place-items:center;font:600 14px/1 var(--f-display);border:1.5px dashed var(--ctl);color:var(--ink2)}
.score.has{border-style:solid;border-color:var(--ue);background:var(--ue);color:var(--on-ue)}
.score.low{border-color:var(--coral-ink);background:var(--coral-soft);color:var(--coral-ink)}
.tl{position:relative;margin-top:6px}
.tl li{position:relative;display:grid;grid-template-columns:66px minmax(0,1fr);gap:28px;padding:9px 0 9px;font:500 14.5px/1.4 var(--f-text)}
.tl li::before{content:"";position:absolute;left:80px;top:0;bottom:0;width:1px;background:var(--rule2)}
.tl li::after{content:"";position:absolute;left:76px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink)}
.tl b{font:600 14px/1.4 var(--f-display);text-align:right}
.tl li.past{color:var(--ink3)}
.tl li.past::after{background:var(--ink3);border-color:var(--ink3)}
.tl li.next::after{background:var(--gold);border-color:var(--gold2);width:11px;height:11px;left:75px;top:13px}
.rule-n{margin-top:18px;padding:12px 14px;border-left:3px solid var(--gold2);background:var(--gold-soft);border-radius:0 10px 10px 0;font:500 14.5px/1.45 var(--f-text)}

/* semaine */
.weekhead{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px}
.weekhead h2{font:700 20px/1.15 var(--f-display);letter-spacing:-.02em;text-align:center}
.weekhead p{font:500 13.5px/1.3 var(--f-text);color:var(--ink2);text-align:center;margin-top:3px}
.iconbtn{width:44px;height:44px;border-radius:11px;border:1.5px solid var(--ink);display:grid;place-items:center;color:var(--ink)}
.iconbtn:disabled{border-color:var(--rule2);color:var(--ink3);cursor:default}
.wcount{font:500 13.5px/1.3 var(--f-text);color:var(--ink2);margin-top:7px}
.ms-w{margin-top:12px}
.ms-w li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-left:3px solid var(--gold2);background:var(--gold-soft);border-radius:0 10px 10px 0;font:500 14.5px/1.4 var(--f-text);margin-top:8px}
.ms-w .ic{width:18px;height:18px;margin-top:1px;flex:none}
.ms-w li[style]{border-left-color:var(--ue)}
.ms-w small{display:block;margin-top:2px;color:var(--ink2);font-size:13.5px}
.ms-w .ms-ue{font-weight:600;white-space:nowrap}
.ms-w .ms-ue i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--ue);margin-right:5px;vertical-align:1px}
.ms-w.top{margin:4px 0 10px}
.wk .d{position:relative}
.wk .msd{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--gold2)}
.modh{margin:16px 0 4px;padding:2px 0 2px 10px;border-left:3px solid var(--ue,var(--gold2));font:600 14.5px/1.35 var(--f-display);color:var(--ink)}
.item .lv{display:flex;gap:6px;align-items:flex-start;margin-top:4px;font:500 13px/1.35 var(--f-text);color:var(--ink2)}
.item .lv .ic{width:13px;height:13px;margin-top:1px;flex:none;color:var(--coral-ink)}
.lead{margin-top:10px;font:500 15.5px/1.45 var(--f-text);color:var(--ink2)}
.todo-l{margin-top:4px}
.item.todo .kind{display:flex;flex-wrap:wrap;gap:4px 10px}
.item.todo .tue{display:inline-flex;align-items:center;gap:5px}
.item.todo .tue i{width:8px;height:8px;border-radius:2px;background:var(--ue)}
.item.todo.late .kind > span:first-child{color:var(--coral-ink)}
.item.todo .lv{display:block}
.todo-n{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--rule2);color:var(--ink);text-decoration:none;font:500 14.5px/1.4 var(--f-text)}
.todo-n > span:nth-child(2){flex:1;min-width:0}
.todo-n small{display:block;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-n .ri{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--gold-soft);color:var(--acc-ic);flex:none}
.tm.ev button{grid-template-columns:64px 10px minmax(0,1fr)}
.tm.ev .t{white-space:nowrap}
.save + .save{margin-top:12px}
.steps-s{margin:8px 0 0;padding-left:20px;font:500 14.5px/1.45 var(--f-text);color:var(--ink2);list-style:decimal}
.steps-s li{margin-top:3px}
.tm.ev small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--rule);gap:2px;margin-bottom:12px}
.seg button{min-height:40px;padding:0 18px;border-radius:9px;font:600 14.5px/1 var(--f-text);color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(11,14,34,.18)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}
.mgrid .wd{font:600 11px/1 var(--f-text);text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);text-align:center;padding:2px 0 4px}
.mday{position:relative;min-height:52px;min-width:0;border-radius:9px;border:1px solid var(--rule);padding:6px 1px 5px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink);background:transparent;font:inherit}
button.mday{border-color:var(--ctl);cursor:pointer}
.mday .n{font:700 15px/1 var(--f-display)}
.mday.out{visibility:hidden}
.mday.rest .n{color:var(--ink3);font-weight:600}
.mday.today{box-shadow:inset 0 0 0 2px var(--gold2)}
.mday[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.mday[aria-pressed="true"] .n{color:var(--paper)}
.mday .dts{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:30px}
.mday .dts i{width:5px;height:5px;border-radius:1px;border:1px solid var(--ue)}
.mday .dts i.f{background:var(--ue)}
.mday[aria-pressed="true"] .dts i{border-color:var(--paper)} .mday[aria-pressed="true"] .dts i.f{background:var(--paper)}
.mday .fl{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--gold2)}
.mleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font:500 12.5px/1.2 var(--f-text);color:var(--ink2)}
.mleg span{display:inline-flex;align-items:center;gap:6px}
.mleg i{width:8px;height:8px;border-radius:2px;border:1px solid var(--ink)}
.mleg .lg-f{background:var(--ink)} .mleg .lg-d{border-radius:50%;border:0;background:var(--gold2)}
button.s-head{width:100%;text-align:left;min-height:44px;color:var(--ink);border-radius:8px}
button.s-head .ic{width:18px;height:18px;color:var(--ink3);flex:none}
.ue-pg p{font:500 14.5px/1.4 var(--f-text);color:var(--ink2)}
.ue-pg p b{font:700 20px/1 var(--f-display);color:var(--ink)}
.ue-pg .bar{margin:10px 0 8px}
.ue-next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--ctl);text-align:left;color:var(--ink);background:var(--paper)}
.ue-next .eb,.ue-next b,.ue-next > span:not(.eb){grid-column:1}
.ue-next b{font:700 16px/1.25 var(--f-display)}
.ue-next > span:not(.eb){font:500 13.5px/1.3 var(--f-text);color:var(--ink2)}
.ue-next .ic{grid-column:2;grid-row:1 / span 3;color:var(--ink3)}
.mods{margin-top:6px}
.mods li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--rule);font:500 14.5px/1.35 var(--f-text)}
.mods .mc2{font:600 13px/1.35 var(--f-text);color:var(--ink2)}
.mods .bar{grid-column:1 / -1;height:5px}
.mods li.ok .mn{color:var(--ink3)} .mods li.ok .mc2{color:var(--ok)}
.mods li.cur .mn{font-weight:700}
.res li{padding:9px 0;border-bottom:1px solid var(--rule);font:500 14px/1.4 var(--f-text)}
.res b{display:block;font-weight:600}
.res span{color:var(--ink2);font-size:13.5px}
.late-n{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--gold-soft);font:500 14.5px/1.42 var(--f-text);color:var(--ink)}
.late-n .ic{color:var(--acc-ic);margin-top:1px;flex:none}
.late-n p{flex:1}
.late-n .more{margin:-10px 0 -12px}
.where{margin-top:12px;font:500 13.5px/1.4 var(--f-text);color:var(--ink3)}
.muted.small{font-size:13.5px;margin-top:6px}
.back{margin-top:14px}
.empty{color:var(--ink2);padding:18px 4px;font:500 15px/1.4 var(--f-text)}

/* méthode */
.save h2{font:700 19px/1.2 var(--f-display);letter-spacing:-.02em}
.save p{font:500 14.5px/1.45 var(--f-text);color:var(--ink2);margin-top:6px}
.gh{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.gh .dot{width:11px;height:11px;border-radius:50%;background:var(--coral);flex:none}
.gh .dot.on{background:var(--ok)}
.gh .btn{flex:0 0 auto;margin-left:auto}
.meth{margin-top:22px;border-top:1px solid var(--ink)}
.meth details{border-bottom:1px solid var(--rule)}
.meth summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:6px 2px;cursor:pointer;font:700 17px/1.25 var(--f-display);letter-spacing:-.015em}
.meth summary::-webkit-details-marker{display:none}
.meth summary .ic{transition:transform .2s;color:var(--ink3)}
.meth details[open] summary .ic{transform:rotate(180deg)}
.dc{padding:0 2px 16px;font:400 15.5px/1.5 var(--f-text);color:var(--ink)}
.dc p{margin-top:2px}
.dc ol{list-style:decimal;padding-left:22px}
.dc ul{list-style:disc;padding-left:22px;margin-top:6px}
.dc li{margin:5px 0;padding-left:2px}
.dc li::marker{color:var(--ink3);font-weight:600}

/* pied */
.m-foot{padding:28px 16px 0;text-align:center}
.motto{display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px/1.2 var(--f-display);color:var(--ink2)}
.motto svg{width:24px;height:24px;flex:none}
.sync{font:500 13px/1.4 var(--f-text);color:var(--ink3);margin-top:6px;min-height:18px}

/* onglets + bouton flottant */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--tab);border-top:1px solid var(--rule2);padding:6px 6px calc(4px + env(safe-area-inset-bottom))}
.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 11.5px/1.1 var(--f-text);color:var(--ink3);border-radius:12px;text-decoration:none}
.ti{position:relative;width:54px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background-color .2s}
@media (max-width:374px){.ti{width:46px}}
.bdg{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--coral-ink);color:#fff;font:700 11px/18px var(--f-text);text-align:center}
.ti .bdg{position:absolute;top:-4px;right:2px}
.nv .bdg{margin-left:auto}
.ti .ic{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ti{background:var(--gold-soft);color:var(--acc-ic)}
.fab{position:fixed;right:max(16px,calc(50% - 294px));bottom:calc(80px + env(safe-area-inset-bottom));z-index:21;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:var(--pri);color:var(--on-pri);box-shadow:0 0 0 4px rgba(255,194,71,.3),0 14px 26px -10px rgba(20,26,63,.6);transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab .ic{width:28px;height:28px;stroke-width:2.5}

/* fiches */
.backdrop{position:fixed;inset:0;z-index:40;background:var(--scrim);display:none;align-items:flex-end;justify-content:center}
.backdrop.open{display:flex}
.sheet{position:relative;background:var(--paper);color:var(--ink);width:100%;max-width:620px;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;border-top:6px solid var(--ue,var(--gold));padding:0 0 calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(11,14,34,.35)}
.backdrop.open .sheet{animation:up .24s ease-out}
.sh-bar{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;align-items:center;min-height:50px;padding:4px 8px 0;background:var(--paper)}
.grab{position:absolute;left:50%;top:9px;width:42px;height:5px;margin-left:-21px;border-radius:99px;background:var(--rule2)}
.x{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.x .ic{width:22px;height:22px}
.sh-head{padding:0 20px 2px}
.sh-head h2{font:700 23px/1.18 var(--f-display);letter-spacing:-.02em;margin:7px 0 8px;text-wrap:pretty}
.sh-ue{display:flex;align-items:center;gap:8px;font:600 14px/1.2 var(--f-text);color:var(--ue,var(--ink2))}
.sh-ue .k{color:var(--ink2);font-weight:500}
.sheet .body{padding:12px 20px;display:flex;flex-direction:column;gap:14px}
.sheet .body>h2{font:700 22px/1.2 var(--f-display);letter-spacing:-.02em;margin-top:0}
.sheet p.muted{font:500 15px/1.45 var(--f-text);color:var(--ink2)}
.hint{display:flex;gap:10px;align-items:flex-start;font:500 14.5px/1.45 var(--f-text);color:var(--ink2);padding:11px 13px;border-radius:10px;background:var(--bg);border:1px solid var(--rule)}
.hint .ic{width:18px;height:18px;color:var(--coral-ink);margin-top:1px}
.sk-note{padding:11px 13px;border-radius:10px;border:1.5px dashed var(--ctl);font:500 14.5px/1.4 var(--f-text);color:var(--ink2)}
.subhead{font:600 11.5px/1.2 var(--f-text);letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin:6px 0 -6px}
.steps{list-style:decimal;padding-left:22px;display:flex;flex-direction:column;gap:7px;font:500 15px/1.45 var(--f-text)}
.steps li::marker{color:var(--ink3);font-weight:600}
.sheet .foot{display:flex;gap:8px;padding:6px 20px 0;flex-wrap:wrap}
.sheet .foot .btn{flex:1 1 40%}
.foot-hint{width:100%;font:500 13.5px/1.3 var(--f-text);color:var(--ink2);text-align:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font:600 14.5px/1.2 var(--f-text)}
.field input,.field textarea{width:100%;min-width:0;background:var(--paper);border:1.5px solid var(--ctl);border-radius:10px;padding:11px 12px;min-height:48px;font:500 16px/1.3 var(--f-text);color:var(--ink)}
.field textarea{min-height:110px;resize:vertical}
.field input:focus-visible,.field textarea:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 13px;border:1.5px solid var(--ctl);border-radius:10px;font:600 14.5px/1.15 var(--f-text);color:var(--ink);background:var(--paper);text-align:left}
.choice small{display:block;font:700 10.5px/1 var(--f-text);letter-spacing:.08em;text-transform:uppercase;color:var(--coral-ink);margin-top:3px}
.choice[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.choice.uec .sq{background:var(--ue)}
.choice.uec[aria-pressed="true"]{background:var(--ue);border-color:var(--ue);color:var(--on-ue)}
.choice.uec[aria-pressed="true"] .sq{background:var(--on-ue)}
.choice.uec[aria-pressed="true"] small{color:inherit}
.choice:disabled,.choice:disabled[aria-pressed="true"]{border-style:dashed;border-color:var(--ctl);background:transparent;color:var(--ink3);cursor:not-allowed}

.toast{position:fixed;left:50%;bottom:calc(152px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);opacity:0;z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font:600 14.5px/1.3 var(--f-text);width:max-content;max-width:min(90vw,440px);text-align:center;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- récompenses : chaque coche, chaque séance, chaque journée ---------- */
.day-n.bump{transform-origin:100% 100%;animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
.segs i.nf::after{animation:segfill .5s cubic-bezier(.3,1.2,.5,1) .05s backwards}
.tag.pop{transform-origin:0 50%;animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
/* le tampon « Séance terminée ! » (sur la carte, ou en haut de la fiche) */
.cel{position:absolute;inset:0;z-index:5;cursor:pointer}
.cel-v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;border-radius:11px;background:var(--veil);overflow-x:clip;
  animation:celin .2s ease-out calc(0s - var(--el,0ms)) backwards,celout .35s ease-in calc(2.2s - var(--el,0ms)) forwards}
.cel.in-sheet{position:sticky;inset:auto;top:50px;height:0;z-index:4}
.cel.in-sheet .cel-v{inset:0 12px auto;height:158px;border-radius:14px;box-shadow:0 10px 30px -16px rgba(11,14,34,.5)}
.stamp{max-width:100%;border:3px double var(--stamp);border-radius:14px;padding:10px 18px 11px;background:var(--paper);text-align:center;transform:rotate(-4deg);box-shadow:0 16px 34px -14px rgba(20,26,63,.45);
  animation:stampin .5s cubic-bezier(.2,1.5,.4,1) calc(.05s - var(--el,0ms)) backwards}
.pk{display:block;width:64px;height:44px;margin:0 auto;overflow:visible}

.stamp b span,.pt-card h2 span{background:linear-gradient(var(--hl),var(--hl)) 0 var(--sw-y)/100% var(--sw-h) no-repeat;padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.stamp b span{animation:swipe .45s ease-out calc(.3s - var(--el,0ms)) backwards}

/* la journée réussie : le ciel se lève */

.pt-dawn{position:fixed;inset:0;background:linear-gradient(180deg,#141a3f 0%,#1a2056 24%,#2c2766 42%,#83406e 60%,#ff7a59 78%,#ffc247 94%);animation:fadein 1.8s ease-in-out .1s backwards}

/* ---------- le drapeau qui monte : les camps sur le sentier ---------- */

/* ---------- la série de jours réussis ---------- */
.ic.fl{color:var(--coral-ink);stroke-width:1.8}

  --bg:#0b0e22; --paper:#151935; --ink:#eef0ff; --ink2:#b9bde2; --ink3:#9da3ce; --rule:#262b52; --rule2:#3b4273; --ctl:#8f95c4; --pen:#cfd3f4;
  --gold:#ffcd5c; --gold2:#ffb84a; --gold-soft:rgba(255,205,92,.16); --hl:#ffcd5c; --hl-ink:#141a3f; --coral-ink:#ff9e82; --ok:#62e0b0;
  --pri:#ffcd5c; --on-pri:#141a3f; --tick:#ffcd5c; --box-on:rgba(255,205,92,.16); --focus:#a9bcff; --stamp:#ffcd5c; --sw-y:100%; --sw-h:12%;
  --ue1:#93a8ff; --ue5:#55d6a7; --ue7:#c6a0ff; --ue8:#5fd0e8; --ue9:#ff8ea1; --ue12:#ffc45c; --ue13:#ff92d8; color-scheme:dark}

<script>
(function(){
"use strict";
/* ================= données du plan ================= */
const PLAN = JSON.parse(document.getElementById("plan").textContent);
const UEN = {UE1:"Droit",UE5:"Économie",UE7:"Management",UE8:"SI",UE9:"Compta",UE12:"Anglais",UE13:"Communication"};
const UE_LIST = ["UE1","UE5","UE7","UE8","UE9","UE12","UE13"];
const KIND = {cours:"Cours",exercices:"Exercices",rapport:"Rapport UE13",revision:"Révision",bilan:"Bilan",examen:"Examen blanc",correction:"Correction",reprise:"Reprise",certificat:"Certificat Studi",off:"Journée off",rattrapage:"Rattrapage",libre:"Créneau libre"};
const HINT = {
  cours:"10 min de rappel sans notes. Puis lis et résume chaque partie en 3 lignes. Fais l'application. Crée 3 à 5 cartes Anki.",
  exercices:"Fais les cas sans regarder la correction, puis corrige-toi ligne par ligne.",
  rapport:"Écris d'abord, corrige ensuite. Garde un seul fichier pour tout le rapport.",
  rattrapage:"Tu rattrapes ici ce qui a glissé. Va à ton rythme, l'appli recalcule la suite.",
  revision:"Révision active : tu te testes, tu ne relis pas passivement.",
  bilan:"Coche ce qui est fait et écris ce qui a coincé. Je t'écris vers 18 h 20.",
  examen:"Conditions réelles : chrono, sans cours, téléphone dans une autre pièce.",
  correction:"Corrige-toi avec le corrigé Comptalia et le commentaire audio, puis note-toi sur 20.",
  reprise:"Retravaille seulement ce qui t'a fait perdre des points.",
  certificat:"QCM Studi de fin d'UE, obligatoire pour ton diplôme Studi.",
  libre:"Tu es en avance sur cette matière. Révise tes fiches, ou ajoute une séance."
};
const OFF_DATES = {"2027-04-22":"Pessah","2027-04-23":"Pessah","2027-04-28":"Pessah","2027-04-29":"Pessah","2027-06-11":"Chavouot","2027-06-12":"Chavouot"};
const EXAM_DAY = (s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); })(PLAN.exam || "2027-05-25");
const CK = new Set(["cours","exercices","rapport"]);           // créneaux de contenu
const TRACKED = new Set(["cours","exercices","rapport","rattrapage","examen","correction","reprise","certificat"]);
const LINK = "https://claude.ai/artifact/7etd7P317B1ZNDJUCViUNb";

/* files de contenu par matière, dans l'ordre du programme */
const Q = {}; const SID_ITEMS = {};
for (const s of PLAN.sessions){
  if (!CK.has(s.kind) || !s.ue) continue;
  const q = (Q[s.ue] = Q[s.ue] || []);
  SID_ITEMS[s.id] = s.items.map(it => { const n = q.length; q.push({ue:s.ue, n, k:it.k, t:it.t, m:it.k==="B"?0:(it.m||0), mod:it.mod||"", lv:it.live||""}); return n; });
}

/* ================= état ================= */
let done = {};       // ue -> {n: "AAAA-MM-JJ"}
let progress = {};   // sessionId -> {done}
let overrides = {}, extras = {}, skips = {}, history = {}, scores = {}, bilans = {}, meta = null;
let db = null, local = false;
let view = null, selWeek = null, selDay = null;
let sheetState = null;
let loaded = false; const seen = new Set();

/* ================= dates ================= */
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => iso(new Date());
const nowHM = () => { const n = new Date(); return pad(n.getHours())+":"+pad(n.getMinutes()); };
const cap = x => x.charAt(0).toUpperCase()+x.slice(1);
const fDay = s => cap(parse(s).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}));
const fShort = s => parse(s).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const fWd = s => parse(s).toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","");
const mins = (a,b) => { const [h1,m1]=a.split(":").map(Number), [h2,m2]=b.split(":").map(Number); return h2*60+m2-h1*60-m1; };
const hm = m => { const h = Math.floor(Math.abs(m)/60), r = Math.abs(m)%60; return (h? h+" h" : "")+(r? (h?" ":"")+r+(h?"":" min") : (h?"":"0 min")); };
const addMin = (t, m) => { const [h,mm] = t.split(":").map(Number); const x = h*60+mm+m; return pad(Math.floor(x/60))+":"+pad(x%60); };
function weekIdFor(d){ if (d < "2026-11-22") return "2026-11-16"; const x = parse(d); x.setDate(x.getDate()-x.getDay()); return iso(x); }

/* ================= moteur : le planning s'adapte ================= */
let legacy = {};
const isDoneItem = (u,n) => !!((done[u] && done[u][n]) || (legacy[u] && legacy[u][n]));
const doneDate = (u,n) => (done[u] && done[u][n]) || (legacy[u] && legacy[u][n]) || null;
function allSlots(){
  const out = [];
  for (const s of PLAN.sessions){
    const o = overrides[s.id];
    if (o && o.cancelled) continue;
    out.push(o ? Object.assign({}, s, o, {items:s.items}) : s);
  }
  for (const id in overrides){ const o = overrides[id]; if (!SID_ITEMS[id] && !PLAN.sessions.some(s=>s.id===id) && o && !o.cancelled && o.date && o.start) out.push(Object.assign({id, items:[], kind:"cours", extra:true}, o)); }
  for (const id in extras){ const e = extras[id]; if (e && e.date && e.start) out.push(Object.assign({id, kind:"cours", items:[], extra:true, title:""}, e)); }
  out.sort((a,b)=> (a.date+a.start).localeCompare(b.date+b.start));
  return shiftLateDays(out);
}
/* départ en retard : tu reportes la 1re séance du jour après son heure de début = tu commences à l'heure du report.
   Toute la journée glisse (même travail, 1 h de pause après 4 h, jamais après 20 h) ; ce qui dépasse 20 h passe aux jours suivants.
   Rien de nouveau n'est enregistré : on lit l'heure du report (skips/<id>.at). */
const LATE_END = "20:00";
function lateStartOf(ds, d){
  if (skips[d]) return null;
  const first = ds[0], sk = first && skips[first.id];
  if (!sk || !sk.at || sk.day) return null;
  const t = new Date(sk.at); if (isNaN(t) || iso(t) !== d) return null;
  const m = t.getHours()*60 + t.getMinutes(), r = Math.ceil(m/5)*5, hm = pad(Math.floor(r/60))+":"+pad(r%60);
  return hm > first.start && hm < LATE_END ? hm : null;
}
function shiftLateDays(out){
  const byDate = new Map();
  for (const s of out) if (!s.extra && s.kind !== "off"){ if (!byDate.has(s.date)) byDate.set(s.date, []); byDate.get(s.date).push(s); }
  const repl = new Map(), drop = new Set();
  for (const [d, ds] of byDate){
    const S = lateStartOf(ds, d); if (!S) continue;
    let cur = S, work = 0, lunch = false, cut = false;
    const bil = ds.some(s => s.kind === "bilan"), stop = bil ? addMin(LATE_END, -10) : LATE_END;   // le bilan du mardi tient toujours avant 20 h
    ds.forEach((s, i) => {
      const dur = mins(s.start, s.end);
      if (i > 0){
        const gap = mins(ds[i-1].end, s.start);
        if (!lunch && work >= 225){ cur = addMin(cur, 60); lunch = true; }   // 1 h de pause après environ 4 h de travail
        else if (gap > 0 && gap < 45) cur = addMin(cur, gap);
      }
      const ns = Object.assign({}, s, {start:cur, end:addMin(cur, dur), late:S, plannedStart:s.start});
      if (i === 0) ns.lateMark = true;
      if (s.kind === "bilan"){ if (ns.start > stop){ ns.start = stop; ns.end = LATE_END; } repl.set(s.id, ns); }
      else if (ns.start >= stop){ drop.add(s.id); cut = true; }
      else { if (ns.end > stop){ ns.end = stop; cut = true; } repl.set(s.id, ns); }
      cur = addMin(cur, dur); work += dur;
    });
    if (cut && repl.get(ds[0].id)) repl.get(ds[0].id).cut = true;
  }
  if (!repl.size && !drop.size) return out;
  return out.filter(s => !drop.has(s.id)).map(s => repl.get(s.id) || s).sort((a,b)=> (a.date+a.start).localeCompare(b.date+b.start));
}
const isSkipped = s => !!((skips[s.id] && !s.lateMark) || skips[s.date]);

function pack(list, q, S, carryKey, carry){
  // remplit un créneau de S minutes à partir de la liste d'indices restants (ordre du programme)
  const got = []; let total = 0; const target = S - (carry[carryKey]||0);
  while (list.length){
    const n = list[0], it = q[n];

let SCHED = null;
function compute(){
  const T = today(), now = nowHM();
  const slots = allSlots();
  const res = {};          // id -> {ue, items:[n], bonus:[n], kind, title, flex}
  const carry = {};
  // 1) jours passés : ce qui était prévu ce jour-là (historique), sinon le plan d'origine
  for (const s of slots){
    if (s.date >= T) continue;
    if (CK.has(s.kind) || s.extra){
      const h = history[s.date] && history[s.date][s.id];
      if (h) res[s.id] = {ue:h.ue, items:h.items||[], bonus:h.bonus||[], kind:h.kind||s.kind, title:h.title||s.title};
      else if (SID_ITEMS[s.id]) res[s.id] = {ue:s.ue, items:SID_ITEMS[s.id].filter(n=>Q[s.ue][n].k!=="B"), bonus:SID_ITEMS[s.id].filter(n=>Q[s.ue][n].k==="B"), kind:s.kind, title:s.title};
      else res[s.id] = {ue:s.ue, items:[], bonus:[], kind:s.kind, title:s.title||""};
    }
  }
  // 2) aujourd'hui : figé pour la journée (ce qui reste à faire au début de la journée)
  const remT = {};
  for (const u in Q) remT[u] = Q[u].filter(it => it.k!=="B" && (!isDoneItem(u,it.n) || doneDate(u,it.n) === T)).map(it=>it.n);
  const assignedToday = {};
  const todays = slots.filter(s => s.date === T);
  const hToday = history[T] || {};
  for (const s of todays){
    if (!(CK.has(s.kind) || s.extra) || !s.ue) continue;
    if (isSkipped(s)){ res[s.id] = {ue:s.ue, items:[], bonus:[], kind:s.kind, title:s.title, skipped:true}; continue; }
    let got;
    if (hToday[s.id] && hToday[s.id].ue === s.ue){ got = hToday[s.id].items.slice(); remT[s.ue] = remT[s.ue].filter(n => !got.includes(n)); }
    else got = pack(remT[s.ue], Q[s.ue], mins(s.start,s.end), s.ue, carry);
    got.forEach(n => (assignedToday[s.ue] = assignedToday[s.ue] || new Set()).add(n));
    res[s.id] = {ue:s.ue, items:got, bonus:bonusAfter(s.ue, got), kind: got.length ? kindOf(s.ue, got, s.kind) : "libre", title: got.length ? titleFor(s.ue, got) : "Créneau libre"};
  }
  // 3) à venir : on reprend là où tu en es vraiment
  const rem = {}, need = {}, capa = {};
  for (const u in Q){ rem[u] = Q[u].filter(it => it.k!=="B" && !isDoneItem(u,it.n) && !(assignedToday[u] && assignedToday[u].has(it.n))).map(it=>it.n); need[u] = rem[u].reduce((a,n)=>a+Q[u][n].m,0); capa[u] = 0; }
  const fut = slots.filter(s => s.date > T);
  for (const s of fut) if ((CK.has(s.kind)||s.extra) && s.ue && !isSkipped(s)) capa[s.ue] = (capa[s.ue]||0) + mins(s.start,s.end);
  const over = {}; for (const u in Q) over[u] = need[u] - (capa[u]||0);
  const maxOver = () => { let best = null; for (const u in Q){ if (rem[u].length && over[u] > 0 && (!best || over[u] > over[best])) best = u; } return best; };
  for (const s of fut){
    const S = mins(s.start, s.end);
    if (isSkipped(s)){ if (CK.has(s.kind)||s.extra) res[s.id] = {ue:s.ue, items:[], bonus:[], kind:s.kind, title:s.title, skipped:true}; continue; }
    if ((CK.has(s.kind) || s.extra) && s.ue){
      let u = s.ue, flex = false;
      if (!rem[u] || !rem[u].length){ const b = maxOver(); if (b){ u = b; flex = true; } }
      if (!rem[u] || !rem[u].length){ res[s.id] = {ue:s.ue, items:[], bonus:[], kind:"libre", title:"Créneau libre"}; continue; }
      const got = pack(rem[u], Q[u], S, u, carry);
      if (flex) over[u] -= got.reduce((a,n)=>a+Q[u][n].m,0);
      res[s.id] = {ue:u, items:got, bonus:bonusAfter(u,got), kind: flex ? "rattrapage" : kindOf(u, got, s.kind), title: (flex?"Rattrapage · ":"")+titleFor(u,got), flex};
      continue;
    }
    // créneaux de révision du dimanche utilisés pour rattraper si besoin
    if (s.kind === "revision" && s.ue == null && s.date.length){
      const b = maxOver();
      const big = b && over[b] >= (s.start === "13:15" ? 120 : 1);
      if (big && (s.start === "13:15" || s.start === "10:30")){
        const got = pack(rem[b], Q[b], S - (s.start==="13:15"?15:0), b+"-flex", {});
        over[b] -= got.reduce((a,n)=>a+Q[b][n].m,0);
        res[s.id] = {ue:b, items:got, bonus:[], kind:"rattrapage", title:"Rattrapage · "+titleFor(b,got), flex:true, anki: s.start==="13:15"};

  SCHED = {slots, res, unplaced, T};

}

  if (u === "UE13") return ns.some(n=>Q[u][n].k==="T") && !ns.some(n=>Q[u][n].k==="L") ? "rapport" : "cours";

/* vue d'une séance prête à afficher */
function view_(s){
  const r = SCHED.res[s.id];
  const v = {id:s.id, date:s.date, start:s.start, end:s.end, kind:s.kind, ue:s.ue, title:s.title, note:s.note, items:[], bonus:[], skipped:isSkipped(s), extra:!!s.extra, raw:s};
  if (r){ v.ue = r.ue; v.kind = r.kind; v.title = r.title || s.title; v.items = r.items; v.bonus = r.bonus || []; v.flex = r.flex; v.anki = r.anki; v.content = true; }

}
function status(v){
  if (v.skipped) return "skip";
  if (v.kind === "off") return "off";

    if (!v.items.length) return v.kind === "libre" ? "free" : "none";
    const d = v.items.filter(n => isDoneItem(v.ue,n)).length;
    return d === v.items.length ? "done" : d ? "part" : "todo";

/* rythme : heures faites vs heures prévues à ce jour dans le plan d'origine */
function rhythm(){
  const T = today(); const out = {}; let planned = 0, did = 0;
  for (const u of UE_LIST){
    let p = 0, d = 0, tot = 0;
    for (const s of PLAN.sessions){ if (SID_ITEMS[s.id] && s.ue===u){ for (const n of SID_ITEMS[s.id]){ const it = Q[u][n]; tot += it.m; if (s.date < T) p += it.m; } } }
    for (const n in (done[u]||{})) d += (Q[u][n] ? Q[u][n].m : 0);
    out[u] = {planned:p, done:d, total:tot, delta:d-p};
    planned += p; did += d;
  }
  out.all = {planned, done:did, delta:did-planned};

}

  let last = null;
  for (const s of SCHED.slots){ const r = SCHED.res[s.id]; if (r && r.ue === u && r.items.length && s.date >= today()) last = s.date; }
  return last;
}

let lastHist = "", lastComp = "", syncTimer = null;
function scheduleSync(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    if (!loaded) return;
    const T = today(); const h = {};
    for (const s of SCHED.slots) if (s.date === T){ const r = SCHED.res[s.id]; if (r && !r.skipped && r.items.length) h[s.id] = {ue:r.ue, items:r.items, bonus:r.bonus, kind:r.kind, title:r.title}; }
    const hj = JSON.stringify(h);
    if (hj !== lastHist && hj !== JSON.stringify(history[T]||{}) && Object.keys(h).length){ lastHist = hj; history[T] = h; persist("history/"+T, h); }
    // les 21 prochains jours, lisibles par l'agent
    const end = iso(new Date(Date.now()+21*86400000));
    const days = [];
    for (const s of SCHED.slots){ if (s.date < T || s.date > end) continue; const v = view_(s);
      days.push({id:v.id, date:v.date, start:v.start, end:v.end, ue:v.ue||null, kind:v.kind, title:v.title, skipped:v.skipped, status:status(v),
        items: v.content ? v.items.map(n=>({t:Q[v.ue][n].t, m:Q[v.ue][n].m, done:isDoneItem(v.ue,n)})).concat(v.bonus.map(n=>({t:Q[v.ue][n].t, bonus:true}))) : (v.static||[]).map(i=>({t:i.t}))}); }
    const rh = rhythm(); const st = {};
    for (const u of UE_LIST) st[u] = {delta_min:rh[u].delta, done_min:rh[u].done, total_min:rh[u].total, projected_end:projectedEnd(u), unplaced_min:SCHED.unplaced[u]||0};
    const comp = JSON.stringify({days, status:st});
    if (comp !== lastComp){ lastComp = comp; persist("computed/schedule", {generatedAt:new Date().toISOString(), today:T, days, status:st}); }
  }, 2500);
}

}
function fcRunView(v){

  const time = h("span",{class:"fc-time num", "aria-hidden":"true"}, mmss(fcLeft()));
  const timer = h("div",{class:"fc-ring"+(work ? "" : " brk"), role:"timer", id:"fc-timer"}, ring, time, fc.paused && !fc.fresh ? h("small",{"aria-hidden":"true"},"En pause") : null);
  fcR = {time, timer, pg: ring.querySelector(".pg")};

      timer,

      h("p",{class:"fc-say"}, say),
      h("div",{class:"fc-acts"},
        h("button",{type:"button", class:"btn primary", id:"fc-go", onclick:fcToggle}, go),
        fc.fresh ? null : h("button",{type:"button", class:"btn", id:"fc-skip", "aria-label": work ? "Passer à la pause" : "Passer au travail", onclick:fcSkip}, ic("skip"), "Passer"))),
    fcTodo(v))];
}
function fcEndView(v){
  fcR = null;

  if (fc.phase === "break")

  // ce qui restait à cocher quand le bloc s'est terminé (la liste ne bouge pas pendant que tu coches)
  if (!fcSnap || fcSnap.sid !== v.id || fcSnap.ue !== v.ue) fcSnap = {sid:v.id, ue:v.ue, ns: v.content ? v.items.filter(n => !isDoneItem(v.ue, n)) : []};
  const all = fcAllDone(v);

  if (all) kids.push(svgEl(PK, {class:"pk", viewBox:"0 0 64 44", "aria-hidden":"true"}), h("h3",{id:"fc-end-t"}, h("span",null,"Séance terminée !")), h("p",{class:"s"},"Bravo. Tu peux souffler."));
  else kids.push(h("h3",{id:"fc-end-t"},"Bloc terminé. Qu'as-tu fini ?"), h("p",{class:"s"}, v.content ? "Coche ce qui est fait. Le reste attendra." : "Ta séance est finie ? Coche-la."));
  if (ns.length) kids.push(h("div",{class:"items"}, ns.map(n => itemRow(v.ue, n, {sid:v.id, pre:"fe", where:"focus", mod:true}))));
  if (!v.content && !all) kids.push(h("button",{type:"button", class:"btn fc-done", id:"fe-done", onclick:()=>{ if (!rewardDone(v, "focus")) toast("Bravo, séance cochée."); }}, ic("check"), "C'est fait"));

}
function renderFocus(){
  if (!fcEl || !fc) return;
  const v = slotView(fc.sid); if (v) fc.v = v;
  const body = document.getElementById("fc-body");
  const ae = document.activeElement, fid = ae && fcEl.contains(ae) && ae.id ? ae.id : null, top = fcEl.scrollTop;
  body.replaceChildren(...(fc.over ? fcEndView(fc.v) : fcRunView(fc.v))); body.classList.toggle("end", fc.over);
  fcLabel = ""; focusPaint();
  fcEl.scrollTop = top;
  if (fid){
    const el = document.getElementById(fid);   // une coche cachée (liste réduite) ne peut pas garder le focus
    const tgt = el && el.offsetParent !== null ? el : (body.querySelector("#fc-list .item:not(.fc-rest) .cb") || body.querySelector(".btn.primary") || document.getElementById("fc-quit"));
    if (tgt) tgt.focus({preventScroll:true});

/* chaque quart de seconde : le temps se recalcule à partir de l'heure de fin */
function focusTick(){
  if (!fc) return;
  if (fcRunning() && Date.now() >= fc.endAt){ fcEnd(Date.now() - fc.endAt < 4000); return; }
  focusPaint();
}
function focusPaint(){
  if (!fc) return;
  const left = fcLeft(), run = fcRunning();
  if (fcR && fcR.time.isConnected){
    const t = mmss(left); if (fcR.time.textContent !== t) fcR.time.textContent = t;
    const f = Math.max(0, Math.min(1, left / FC_LEN[fc.phase]));
    fcR.pg.setAttribute("stroke-dasharray", (f*100).toFixed(2)+" 100");
    fcR.pg.style.opacity = f > .002 ? "" : "0";
    const m = Math.max(1, Math.ceil(left/60000));
    const lab = (fc.phase === "work" ? "Travail" : "Pause")+(fc.paused && !fc.fresh ? ", en pause" : "")+" : il reste "+plural(m,"minute");
    if (lab !== fcLabel){ fcLabel = lab; fcR.timer.setAttribute("aria-label", lab); }
  }
  const title = run ? mmss(left)+" · Plan DCG" : fc.over ? (fc.phase === "work" ? "Bloc terminé · Plan DCG" : "Pause finie · Plan DCG") : DOC_TITLE;
  if (document.title !== title) document.title = title;
}
function fcAfter(){ fcSave(); renderFocus(); fcSyncWake(); }
function fcStart(phase){
  fcSound();   // le son se débloque pendant un geste (iPhone)
  if (fcConf) fcConfirmClose(true);
  fc.phase = phase; fc.remaining = FC_LEN[phase]; fc.endAt = Date.now() + FC_LEN[phase];
  fc.paused = false; fc.fresh = false; fc.over = false; fcSnap = null; if (phase === "work") fc.bw = (fc.bw || 0) + 1; else fc.bp = (fc.bp || 0) + 1;
  fcSay((phase === "work" ? "Travail : 25 minutes. " : "Pause : 5 minutes. ")+fcLine(phase));
  fcAfter();
}
const fcStartWork = () => fcStart("work"), fcStartBreak = () => fcStart("break");
function fcToggle(){
  if (!fc || fc.over) return;
  if (fc.fresh){ fcStartWork(); return; }
  fcSound();
  if (fc.paused){ fc.endAt = Date.now() + fc.remaining; fc.paused = false; fcSay("C'est reparti."); }
  else { fc.remaining = Math.max(0, fc.endAt - Date.now()); fc.paused = true; fcSay("En pause."); }
  fcAfter();
}
function fcSkip(){
  if (!fc || fc.fresh || fc.over) return;
  if (fc.phase === "work") fcEnd(false, true); else fcStartWork();
}
/* fin d'un bloc : l'écran de fin, et deux notes si la page est visible */
function fcEnd(chime, skipped){
  const work = fc.phase === "work";
  fc.over = true; fc.paused = false; fc.remaining = 0;
  if (work && !skipped) fc.rounds++;   // « Passer » ne compte pas comme un bloc fait
  if (fcConf) fcConfirmClose(true);
  fcSay(work ? "Bloc terminé. Qu'as-tu fini ?" : "Pause finie. On reprend ?");
  if (chime) fcChime(!work);
  fcAfter();
}
function fcToggleMute(){
  const m = !fcMuted();
  try{ if (m) localStorage.setItem(FC_MUTE, "1"); else localStorage.removeItem(FC_MUTE); }catch(e){}
  const b = document.getElementById("fc-mute");
  if (b){ b.setAttribute("aria-pressed", String(m)); b.replaceChildren(ic(m ? "mute" : "sound")); }
  toast(m ? "Son coupé." : "Son remis.");

function fcQuitAsk(){ if (!fc) return; if (!fc.fresh && !fc.over) fcConfirm(); else fcQuit(); }
function fcConfirm(){
  if (fcConf || !fcEl) return;
  fcConf = true;
  fcEl.querySelector(".fc-in").inert = true;
  const no = h("button",{type:"button", class:"btn primary", id:"fc-no", onclick:()=>fcConfirmClose()}, "Non, je continue");
  fcEl.append(h("div",{class:"fc-conf", id:"fc-conf"},
    h("div",{role:"alertdialog", "aria-modal":"true", "aria-labelledby":"fc-ct", "aria-describedby":"fc-cd"},
      h("h3",{id:"fc-ct"},"Arrêter le minuteur ?"), h("p",{id:"fc-cd"},"Tes coches restent enregistrées."),
      h("div",{class:"fc-acts"}, h("button",{type:"button", class:"btn", id:"fc-yes", onclick:fcQuit}, "Oui, arrêter"), no))));
  no.focus({preventScroll:true});
}
function fcConfirmClose(silent){
  fcConf = false;
  const b = document.getElementById("fc-conf"); if (b) b.remove();
  if (!fcEl) return;
  fcEl.querySelector(".fc-in").inert = false;
  if (!silent){ const q = document.getElementById("fc-quit"); if (q) q.focus({preventScroll:true}); }

}
function fcQuit(){

  let t = fcBack && document.getElementById(fcBack);
  if (t && (t.closest("#backdrop:not(.open)") || t.closest("[inert]") || !t.offsetParent)) t = null;
  if (!t && sid){ const c = cardOf(sid); t = c && c.querySelector(".c-open"); }
  if (t) t.focus({preventScroll:true});

}
function focusKey(e){
  if (e.key === "Escape"){ e.preventDefault(); if (fcConf) fcConfirmClose(); else fcQuitAsk(); return; }
  if (e.key !== "Tab") return;
  const root = fcConf ? document.getElementById("fc-conf") : fcEl;
  const f = [...root.querySelectorAll("button:not([disabled]), input, a[href]")].filter(x => x.offsetParent !== null || x.classList.contains("cb"));
  const vis = f.filter(x => !x.closest("[inert]") && (x.classList.contains("cb") ? x.closest(".item").offsetParent !== null : true));
  if (!vis.length){ e.preventDefault(); return; }
  const i = vis.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0){ e.preventDefault(); vis[vis.length-1].focus(); }
  else if (!e.shiftKey && (i === -1 || i === vis.length-1)){ e.preventDefault(); vis[0].focus(); }
}
document.addEventListener("visibilitychange", () => { if (fcEl){ focusTick(); fcSyncWake(); } });
window.addEventListener("pageshow", () => { if (fcEl){ focusTick(); fcSyncWake(); } });

function migrateLegacy(o){
  legacy = {};
  for (const id in o){
    const p = o[id]; const ns = SID_ITEMS[id]; if (!ns || !p) continue;
    const s = PLAN.sessions.find(x=>x.id===id); if (!s) continue;
    const idxs = p.done ? ns.map((n,i)=>i) : (p.items||[]);
    idxs.forEach(i => { const n = ns[i]; if (n === undefined) return; legacy[s.ue] = legacy[s.ue] || {}; legacy[s.ue][n] = (p.at||"").slice(0,10) || s.date; });
  }
}
